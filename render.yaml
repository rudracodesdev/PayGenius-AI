services:
  - type: web
    name: paypal-ai-hackathon
    env: python
    buildCommand: pip install -r requirements.txt && python seed_demo_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false